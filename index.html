<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen Recorder</title>
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <main class="app-container">
    <div class="recorder-card">
      <h1 class="logo">🖥️ Screen Recorder</h1>
      <div class="controls">
        <button id="startBtn" class="btn btn-primary">Start Recording</button>
        <button id="stopBtn" class="btn btn-danger" disabled>Stop</button>
        <button id="downloadBtn" class="btn btn-secondary" disabled>Download</button>
      </div>
      <video id="preview"></video>
      <p id="status" class="status-text">Ready to record your screen</p>
    </div>
    <footer>
      <small>Made with ❤️ by Hussein Sharif</small>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
